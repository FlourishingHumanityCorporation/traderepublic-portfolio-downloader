# Auto-generated by sync-pre-commit-configs. Do not edit manually.
# Override registry: .meta/pre-commit-overrides.json
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (^|/)evals/(data|results)/
      - id: end-of-file-fixer
        exclude: (^|/)evals/(data|results)/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^\.vscode/launch\.json$
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: (^|/)evals/(data|results)/
      - id: check-case-conflict
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: test-policy-changed-files
        name: test policy changed-file guard
        entry: bash -c 'exec python3 "$HOME/CodeProjects/.meta/scripts/test-policy-changed-files" "$@"' --
        language: system
        files: (^|/)(tests/.*\.py|conftest\.py|test_.*\.py|appcheck\.toml|projects\.json|Makefile|package\.json)$
        pass_filenames: true
        require_serial: true
      - id: silent-degradation-gate
        name: silent-degradation gate (no new HIGH)
        entry: bash -c 'exec $HOME/CodeProjects/tools/code-hygiene/.venv/bin/code-hygiene audit silent-degradation --path . --gate --repo-only'
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true
      - id: architecture-check
        name: architecture module boundary gate (traderepublic-portfolio-downloader)
        entry: make architecture-check
        language: system
        files: ^(?:(?:\.pre-commit-config\.yaml|AGENTS\.md|CLAUDE\.md|Makefile|appcheck\.toml|pyproject\.toml|\.appcheck/architecture-baseline\.json|docs/architecture/ARCHITECTURE\.md|cmd|internal|tests|v2/cmd|v2/internal|v2/pkg|\.continue|\.github|\.vscode|assets|docs|v2/tests|scripts|entrypoint\.sh|\.appcheck/projects\.json|\.claudeignore|\.editorconfig|\.gitignore|\.golangci\.yml|LICENSE|README\.md|REBUILD\.md|SYMBOLS-full\.md|SYMBOLS\.md|docker-compose\.yml|go\.mod|go\.sum|script-surfaces\.toml|v2/\.env\.example|v2/\.gitignore|v2/\.golangci\.yml|v2/Makefile|v2/README\.md|v2/go\.mod|v2/go\.sum|\.appcheck|docs/architecture|v2)$|(?:cmd/|internal/|tests/|v2/cmd/|v2/internal/|v2/pkg/|\.continue/|\.github/|\.vscode/|assets/|docs/|v2/tests/|scripts/)|(?:[^/]+)$)
        pass_filenames: false
        require_serial: true
        stages:
          - pre-commit
          - pre-push
